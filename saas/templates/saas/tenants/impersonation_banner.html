{% if request.impersonation_tenant %}
<div role="status" style="position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#fff3cd;color:#332701;padding:12px 24px;display:flex;gap:20px;align-items:center">
<span>Impersonating {{ request.impersonation_tenant.company.company }} as {{ request.user.username }}</span>
<form method="post" action="{% url 'tenant-impersonation-stop' %}" hx-boost="false">{% csrf_token %}<button type="submit" class="oh-btn">Return to platform</button></form>
</div>
{% endif %}
